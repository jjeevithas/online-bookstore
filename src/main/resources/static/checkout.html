<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Order Confirmation</title><link rel="stylesheet" href="/css/style.css"></head>
<body><header><div class="nav"><a class="logo" href="/">BookNest</a><div class="nav-links"><a href="/">Home</a><a href="/cart.html">Cart</a></div></div></header>
<main><div class="confirmation"><div class="check">✓</div><h1>Order Confirmed!</h1><p>Thank you for shopping with BookNest.</p><p id="order"></p><a class="primary linkbtn" href="/">Continue Shopping</a></div></main>
<script>
const p=new URLSearchParams(location.search);
document.getElementById('order').innerHTML=`Order ID: <strong>#${p.get('orderId')}</strong><br>Total Paid: <strong>₹${Number(p.get('total')).toFixed(2)}</strong>`;
</script></body></html>
