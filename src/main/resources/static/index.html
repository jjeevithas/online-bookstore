<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BookNest - Online Bookstore</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<header>
    <div class="nav">

        <a class="logo" href="/">BookNest</a>

        <div class="nav-links">
            <a href="/">Home</a>
            <a href="/cart.html">
                Cart <span id="cartCount">0</span>
            </a>
        </div>

    </div>
</header>

<main>

    <section class="hero">

        <div>
            <p class="tag">ONLINE BOOKSTORE</p>

            <h1>
                Find your next<br>
                <span>great read.</span>
            </h1>

            <p>
                Browse our collection of popular books
                and add your favourites to your cart.
            </p>
        </div>

    </section>

    <!-- Search and Category Filter -->

    <div class="toolbar">

        <input
            id="search"
            placeholder="Search by book title or author..."
        >

        <select id="categoryFilter" onchange="loadBooks()">
    <option value="">All Categories</option>
    <option value="Fiction">Fiction</option>
    <option value="Self Help">Self Help</option>
    <option value="Technology">Technology</option>
    <option value="Business">Business</option>
</select>

        <button onclick="loadBooks()">
            Search
        </button>

    </div>

    <h2>Featured Books</h2>

    <div id="books" class="grid"></div>

</main>

<script src="/js/books.js"></script>

</body>

</html>
